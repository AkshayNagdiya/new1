
<!DOCTYPE html>
<html>
<head>
<title>Todo CRUD App</title>
<style>
body{font-family:Arial;background:#f3f4f6;display:flex;justify-content:center;padding:50px 15px}
.container{background:white;padding:25px;border-radius:12px;width:400px;max-width:100%;box-shadow:0 4px 15px #ccc}
h2{text-align:center}
input{padding:10px;width:55%;border:1px solid #ccc;border-radius:5px}
button{padding:10px;border:0;border-radius:5px;background:#4f46e5;color:white;cursor:pointer;margin:3px}
li{margin-top:12px;background:#eee;padding:10px;border-radius:5px;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="container">
<h2>My Todo App</h2>
<input id="task" placeholder="Enter your task">
<button onclick="addTodo()">Add</button>
<ul id="list"></ul>
</div>
<script>
let todos=[];
function showTodos(){
document.getElementById("list").innerHTML="";
todos.forEach((todo,index)=>{
let li=document.createElement("li");
li.appendChild(document.createTextNode(todo+" "));
let edit=document.createElement("button");
edit.textContent="Edit";
edit.onclick=()=>editTodo(index);
let del=document.createElement("button");
del.textContent="Delete";
del.style.background="red";
del.onclick=()=>deleteTodo(index);
li.append(edit,del);
document.getElementById("list").appendChild(li);
});
}
function addTodo(){
let input=document.getElementById("task");
if(input.value.trim()==="")return alert("Enter a task!");
todos.push(input.value.trim());
input.value="";
showTodos();
}
function editTodo(index){
let updated=prompt("Edit your task:",todos[index]);
if(updated!==null&&updated.trim()!==""){
todos[index]=updated.trim();
showTodos();
}
}
function deleteTodo(index){
if(confirm("Are you sure you want to delete?")){
todos.splice(index,1);
showTodos();
}
}
</script>
</body>
</html>
